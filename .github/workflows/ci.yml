name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/checkout@v4
      - run: moon fmt --check
      - run: moon check --target wasm-gc --deny-warn
      - run: moon check --target wasm --deny-warn
      - run: moon check --target js --deny-warn
      - run: moon check --target native --deny-warn
      - run: moon test --target wasm-gc
